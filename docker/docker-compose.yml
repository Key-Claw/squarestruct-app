# Entorno completo pensado para despliegue academico en AWS EC2.
# Solo el reverse proxy publica puertos al exterior; frontend, backend y MySQL
# quedan dentro de la red Docker para reducir errores de CORS y exposicion.
services:
  mysql:
    image: mysql:8.4
    container_name: squarestruct-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-squarestruct}
      MYSQL_USER: ${DB_USER:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-20doblajepuro37}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - squarestruct_mysql_data:/var/lib/mysql
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../backend/db/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    networks:
      - squarestruct-internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: squarestruct-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-20doblajepuro37}
      DB_NAME: ${DB_NAME:-squarestruct}
      JWT_SECRET: ${JWT_SECRET:-cambia_esta_clave_en_ec2}
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - squarestruct-internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Vacio a proposito: el frontend usara /api y nginx lo enviara al backend.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: squarestruct-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - squarestruct-internal

  proxy:
    image: nginx:1.27-alpine
    container_name: squarestruct-proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      # Preparado para HTTPS futuro. Activarlo cuando exista configuracion SSL.
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - squarestruct-internal

volumes:
  squarestruct_mysql_data:

networks:
  squarestruct-internal:
    driver: bridge
