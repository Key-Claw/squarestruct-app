name: Backend and Frontend CI

# Este workflow se ejecuta cuando hay cambios en dev.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  NODE_VERSION: 20.19.0

jobs:
  backend-tests:
    # GitHub Actions ejecuta el job en un runner Linux limpio.
    runs-on: ubuntu-latest

    # Servicio de base de datos necesario para los tests de integracion.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: squarestruct_test
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    # Variables de entorno que el backend necesita para conectarse a MySQL y arrancar.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: squarestruct_test
      PORT: 3000
      JWT_SECRET: ci_jwt_secret
      NODE_ENV: test

    # Todo lo que se ejecute aqui se hara dentro de backend/.
    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      # Descarga el codigo del repositorio para poder ejecutar los tests.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala Node.js y activa la cache de npm para acelerar futuras ejecuciones.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # El runner necesita el cliente mysql para cargar el esquema y los seeds.
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      # Espera a que el servicio MySQL este listo antes de seguir.
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      # Carga el esquema y los datos iniciales que usan los tests de integracion.
      - name: Load schema and seeds
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci_root_password squarestruct_test < db/schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -pci_root_password squarestruct_test < db/seeds.sql


      # Instala las dependencias del backend desde backend/package.json.
      - name: Install backend dependencies
        run: npm ci

      # Ejecuta Jest con el script definido en package.json.
      - name: Run backend tests
        run: npm test

  # Este segundo job se ejecuta en paralelo al primero, tambien en un runner Linux limpio.
  frontend-build:
    runs-on: ubuntu-latest

    # Variable usada por Vite para configurar la URL base de la API durante el build.
    env:
      VITE_API_URL: http://localhost:3000/api

    # Todo lo que se ejecute aqui se hara dentro de frontend/.
    defaults:
      run:
        shell: bash
        working-directory: frontend

    # Los pasos para el frontend instalan dependencias, ejecutan tests, revisan lint y construyen la aplicacion.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm run test:run

      - name: Lint frontend # Esto es opcional, pero es buena practica tener un paso de lint para asegurarnos de que el codigo sigue las reglas de estilo definidas.
        run: npm run lint

      - name: Build frontend # Compila la aplicacion React usando Vite y valida imports, assets, CSS y variables de build.
        run: npm run build
