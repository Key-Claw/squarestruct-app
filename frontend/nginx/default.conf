# Servidor interno del frontend.
# HashRouter guarda las rutas despues de #, pero el fallback mantiene la SPA
# preparada si algun recurso llega como ruta directa.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
